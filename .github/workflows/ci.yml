name: Check plugin

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  windows-smoke-commands:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - name: Check Windows package-manager launches
        run: pnpm exec vitest run scripts/validation/compatibility-smoke.test.mjs
      - name: Check Windows protocol-reference preparation
        run: pnpm exec vitest run scripts/sync-typert-protocol.test.mjs
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm test
      - run: pnpm run build
      - name: Check runtime is up to date
        shell: bash
        run: |
          runtime_status="$(git status --porcelain --untracked-files=all --ignored -- runtime/)"
          if [ -n "$runtime_status" ]; then
            printf '%s\n' "$runtime_status"
            echo '::error::runtime/ differs from the committed build. Run pnpm run build and commit runtime/.'
            exit 1
          fi
      - name: Install smoke browser
        run: pnpm exec playwright install --with-deps chromium
      - name: Verify formal package compatibility
        run: pnpm run test:compatibility
