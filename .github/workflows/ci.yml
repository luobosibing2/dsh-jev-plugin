name: Check plugin

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm test
      - run: pnpm run build
      - name: Check runtime is up to date
        shell: bash
        run: |
          runtime_status="$(git status --porcelain --untracked-files=all --ignored -- runtime/)"
          if [ -n "$runtime_status" ]; then
            printf '%s\n' "$runtime_status"
            echo '::error::runtime/ differs from the committed build. Run pnpm run build and commit runtime/.'
            exit 1
          fi
